<!DOCTYPE html>
<html>

<head>
    <title>Meridian &#8211; Authorize</title>
    <script>
        if (window.location.pathname.endsWith('/index.html')) {
            const newPath = window.location.pathname.replace(/index\.html$/, '');
            window.location.replace(newPath + window.location.search + window.location.hash);
        }
    </script>
    <link rel="stylesheet" href="/cdn/css/index.css">
    <link rel="stylesheet" href="/cdn/css/fontloader.css">
    <link rel="stylesheet" href="/cdn/css/shared.css">
    <script type="module" src="/cdn/js/index.js"></script>
    <script src="/cdn/js/meridian-renderer.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
</head>

<body>
    <div class="fill-dev">
        <p id="fill-dev-p">IN DEVELOPMENT/IN DEVELOPMENT/IN DEVELOPMENT</p>
    </div>
    <div class="fill-notif">
        <div class="fn-in">
            <h1>Title</h1>
            <br>
            <p>Description</p>
            <button class="tvButton">
                <p>Action</p>
            </button>
        </div>
    </div>
    <div class="fill-notif" id="process-notif">
        <div class="fn-in">
            <h1>Processing</h1>
            <br>
            <img src="/cdn/assets/icons/loadBlack.svg" class="loadWheel spin whiteOnly">
            <img src="/cdn/assets/icons/loadWhite.svg" class="loadWheel spin blackOnly">
        </div>
    </div>
    <canvas class="fill" id="meridian-ocean"></canvas>
    <div class="f-out">
        <form id="totpValidate" class="t">
            <p id="errorBox">Notice/Error Message</p>
            <br>
            <h1>
                Welcome to <span class="h1 meridian-text">Meridian</span>.
            </h1>
            <br>
            <p>
                Enter your PowerSchool credentials to access your account.
            </p>
            <div class="tvif">
                <div class="credential-input">
                    <input class="ci-input" id="ci-username" type="text" maxlength="15" placeholder="Username">
                    <input class="ci-input" id="ci-password" type="password" placeholder="Password">
                </div>
            </div>
            <div class="tvButtonField">
                <button class="tvButton" type="submit">
                    <p>Log in</p>
                </button>
            </div>
            <br>
            <p class="italics">Only student logins are supported right now. Parents/Guardians must use
                the <a class="novisited" href="https://ps.westboroughk12.org">old portal</a>.</p>
        </form>
    </div>
</body>

</html>
